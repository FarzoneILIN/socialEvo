[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialevo"
version = "0.1.0"
description = "Research scaffold for multi-agent self-organization experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SocialEvo contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

